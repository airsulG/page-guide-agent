<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Page Guide Agent</title>
  <style>
    :root {
      --bg: #f7f7f8; --surface: #ffffff; --border: #e6e6ea;
      --text: #17171a; --text-2: #71717a; --accent: #7c3aed; --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      width: 320px; background: var(--bg);
      font: 13px/1.45 -apple-system, "PingFang SC", sans-serif; color: var(--text);
      padding: 14px;
    }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .logo { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); position: relative; flex: none; }
    .logo::after { content: ""; position: absolute; inset: 6px; border: 2px solid #fff; border-radius: 3px; }
    header h1 { font-size: 14px; font-weight: 600; }
    header span { margin-left: auto; font-size: 11px; color: var(--text-2); }
    .page { font-size: 11px; color: var(--text-2); margin-bottom: 8px; }
    .page b { color: var(--text); font-weight: 500; }
    .guide {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px;
    }
    .guide .info { flex: 1; min-width: 0; }
    .guide .name { font-weight: 500; font-size: 13px; }
    .guide .meta { font-size: 11px; color: var(--text-2); margin-top: 2px; }
    .play {
      appearance: none; border: none; border-radius: 8px; cursor: pointer;
      background: var(--accent); color: #fff; height: 30px; padding: 0 12px;
      font: inherit; font-weight: 500; flex: none;
    }
    .play:hover { filter: brightness(1.08); }
    .empty {
      background: var(--surface); border: 1px dashed var(--border); border-radius: 10px;
      padding: 16px 12px; text-align: center; color: var(--text-2); font-size: 12px;
    }
    .footer { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
    .import {
      flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 10px; text-align: center; color: var(--text-2); font-size: 12px; cursor: pointer;
    }
    .import:hover { color: var(--text); }
    .stop { background: transparent; border: none; color: var(--text-2); font-size: 12px; cursor: pointer; padding: 7px 6px; }
    .stop:hover { color: var(--danger); }
    #file { display: none; }
    #status { margin-top: 8px; font-size: 11px; color: var(--text-2); min-height: 14px; }
    #status.err { color: var(--danger); }
  </style>
</head>
<body>
  <header>
    <div class="logo"></div>
    <h1>Page Guide Agent</h1>
    <span>v0.2</span>
  </header>
  <div class="page" id="page-line">读取当前页面…</div>
  <div id="list"></div>
  <div class="footer">
    <label class="import" for="file">导入 guides.json（多任务包）</label>
    <button class="stop" id="stop">停止播放</button>
  </div>
  <input id="file" type="file" accept=".json">
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
