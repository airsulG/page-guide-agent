<!doctype html>
<html>
<body style="width:260px;font:13px -apple-system,sans-serif;padding:12px;">
  <div style="font-weight:600;margin-bottom:8px;">Page Guide Agent</div>
  <div id="status" style="color:#666;margin-bottom:8px;">未加载指引</div>
  <div style="display:flex;gap:6px;margin-bottom:8px;">
    <button id="play" style="flex:1;">▶ 播放</button>
    <button id="replay" style="flex:1;">↺ 重播</button>
    <button id="stop" style="flex:1;">■ 停止</button>
  </div>
  <label style="display:block;font-size:12px;color:#444;">导入 guide.json（可选，覆盖当前指引）</label>
  <input id="file" type="file" accept=".json" style="margin-top:4px;width:100%;">
  <script src="popup.js"></script>
</body>
</html>
